name: et-omniverse-infra

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: et-omniverse-mssql
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    ports:
      - "1433:1433"
    volumes:
      - et_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: et-omniverse-redis
    ports:
      - "6379:6379"
    volumes:
      - et_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:2024.3
    container_name: et-omniverse-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - et_seq_data:/data

volumes:
  et_mssql_data:
  et_redis_data:
  et_seq_data:
